[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-dietmetrics"
version = "0.1.0"
description = "A reusable Django app to track calories, macros, and nutrition metrics during a cutting phase."
readme = "README.md"
authors = [{name="Nemesix493"}]
dependencies = ["Django>=4.2"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
